[project]
name = "s3vectore-store"
version = "0.1.0"
description = "Amazon S3 Vectors integration for GenAI applications"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.124",
    "dotenv>=0.9.9",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]